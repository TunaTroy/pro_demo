<core:FragmentDefinition 
  xmlns="sap.m"
  xmlns:core="sap.ui.core"
  xmlns:viz="sap.viz.ui5.controls"
  xmlns:viz.data="sap.viz.ui5.data"
  xmlns:viz.feeds="sap.viz.ui5.controls.common.feeds">
  
  <VBox id="vbox4" class="card--donut" alignItems="Center">
    
    <!-- Title -->
    <VBox width="100%" alignItems="Center" class="sapUiSmallMarginBottom">
      <Text text="{/title}" class="chartTitle" />
      <Text text="{/subtitle}" class="chartSubtitle" />
    </VBox>
    
    <!-- Donut Chart -->
    <viz:VizFrame
      id="statusDonutChart"
      uiConfig="{applicationSet:'fiori'}"
      vizType="donut"
      width="100%"
      height="280px">
      
      <viz.data:FlattenedDataset data="{/items}">
        <viz.data:DimensionDefinition name="Status" value="{status}" />
        <viz.data:MeasureDefinition name="Count" value="{count}" />
      </viz.data:FlattenedDataset>
      
      <viz:feeds>
        <viz.feeds:FeedItem uid="size" type="Measure" values="Count" />
        <viz.feeds:FeedItem uid="color" type="Dimension" values="Status" />
      </viz:feeds>
    </viz:VizFrame>
  </VBox>
  
</core:FragmentDefinition>
