

# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "3.1"
metadata:
  name: demodashboard
type: application

framework:
  name: SAPUI5
  version: 1.120.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ushell
    - name: sap.ui.unified
    - name: sap.tnt
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://s35.gb.ucc.cit.tum.de
          client: '302'
        app:
          name: ZZ1_G18MM
          description: My deploy app
          package: $TMP
          transport: ''
        exclude:
          - /test/
